name: Migrate production database

# Applies Prisma migrations + Bible discussion schema bootstrap to Neon.
# Use when comment APIs return 500 after deploy (tables missing / migrate skipped).

on:
  workflow_dispatch:

concurrency:
  group: prod-database-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve database secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing repository secret DATABASE_URL (Neon pooled URL from Vercel)."
            exit 1
          fi
          RESOLVED_DIRECT="${DIRECT_URL:-$DATABASE_URL_UNPOOLED}"
          if [ -z "$RESOLVED_DIRECT" ]; then
            echo "::error::Missing DIRECT_URL. Add repository secret DIRECT_URL (or DATABASE_URL_UNPOOLED) with the Neon direct URL from Vercel — same value as Vercel env DATABASE_URL_UNPOOLED."
            exit 1
          fi
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "DIRECT_URL=$RESOLVED_DIRECT" >> "$GITHUB_ENV"

      - name: Apply Prisma migrations
        run: pnpm run db:migrate-deploy

      - name: Ensure Bible discussion schema
        run: pnpm exec tsx scripts/ensure-bible-discussion-schema.ts
