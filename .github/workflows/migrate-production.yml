name: Migrate production database

# Applies Prisma migrations + Bible discussion schema bootstrap to Neon.
# Use when comment APIs return 500 after deploy (tables missing / migrate skipped).

on:
  workflow_dispatch:

concurrency:
  group: prod-database-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ] || [ -z "${{ secrets.DIRECT_URL }}" ]; then
            echo "::error::Add DATABASE_URL and DIRECT_URL to GitHub Actions secrets."
            exit 1
          fi

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm run db:migrate-deploy

      - name: Ensure Bible discussion schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm exec tsx scripts/ensure-bible-discussion-schema.ts
