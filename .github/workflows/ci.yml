name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Preview build (skip DB migrate)
        run: VERCEL_ENV=preview bash scripts/vercel-build.sh
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?connect_timeout=2
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?connect_timeout=2
          AUTH_SECRET: ci-placeholder-auth-secret-32chars-minimum
          NEXT_PUBLIC_SITE_URL: https://www.catholickidscrafts.com
