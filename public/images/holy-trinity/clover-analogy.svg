<svg width="560" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title">
  <title id="title">We say one clover, not three leaves</title>
  <rect width="560" height="300" fill="#fffaf5" rx="12" stroke="#e8dcc8" stroke-width="2"/>

  <g opacity="0.55">
    <text x="140" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#888">We do NOT say:</text>
    <circle cx="70" cy="95" r="28" fill="#a8d5a8" stroke="#5a9a5a"/>
    <circle cx="140" cy="95" r="28" fill="#a8d5a8" stroke="#5a9a5a"/>
    <circle cx="210" cy="95" r="28" fill="#a8d5a8" stroke="#5a9a5a"/>
    <text x="70" y="100" text-anchor="middle" font-size="11" fill="#2d5a2d">leaf</text>
    <text x="140" y="100" text-anchor="middle" font-size="11" fill="#2d5a2d">leaf</text>
    <text x="210" y="100" text-anchor="middle" font-size="11" fill="#2d5a2d">leaf</text>
    <text x="140" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#666">three separate leaves?</text>
    <line x1="40" y1="160" x2="240" y2="60" stroke="#c44" stroke-width="4"/>
    <line x1="40" y1="60" x2="240" y2="160" stroke="#c44" stroke-width="4"/>
  </g>

  <text x="280" y="110" text-anchor="middle" font-size="28" fill="#5d4037">&#8594;</text>

  <g transform="translate(320 50)">
    <text x="100" y="-14" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#3d6b3d">We DO say:</text>
    <path d="M100 130 Q98 90 100 55 Q102 40 100 28" fill="none" stroke="#2d6b34" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="100" cy="35" rx="38" ry="48" fill="#5cb85c"/>
    <ellipse cx="48" cy="88" rx="38" ry="48" fill="#5cb85c" transform="rotate(-55 48 88)"/>
    <ellipse cx="152" cy="88" rx="38" ry="48" fill="#5cb85c" transform="rotate(55 152 88)"/>
    <text x="100" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#4a3728">one shamrock</text>
    <text x="100" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#6b5b4f">(one clover plant)</text>
  </g>

  <rect x="40" y="218" width="480" height="64" rx="8" fill="#f0f7ff" stroke="#b8d4f0"/>
  <text x="280" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2c5282">So too: Father, Son, and Holy Spirit</text>
  <text x="280" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#2c5282">are three Persons - but only one God.</text>
</svg>
