<svg width="520" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="title desc">
  <title id="title">Holy Trinity clover symbol</title>
  <desc id="desc">Three leaves on one stem labeled Father, Son, and Holy Spirit, with One God on the stem.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fc"/>
      <stop offset="100%" stop-color="#f5f0e8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fcf6f"/>
      <stop offset="100%" stop-color="#3d9a4a"/>
    </linearGradient>
  </defs>
  <rect width="520" height="420" fill="url(#sky)" rx="16"/>
  <text x="260" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#4a3728">One God � Three Divine Persons</text>

  <!-- stem -->
  <path d="M260 310 Q255 250 260 200 Q265 170 260 155" fill="none" stroke="#2d6b34" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="260" cy="318" rx="18" ry="8" fill="#8b6914" opacity="0.35"/>

  <!-- leaves -->
  <ellipse cx="260" cy="118" rx="62" ry="78" fill="url(#leaf)" transform="rotate(0 260 118)"/>
  <ellipse cx="168" cy="198" rx="62" ry="78" fill="url(#leaf)" transform="rotate(-58 168 198)"/>
  <ellipse cx="352" cy="198" rx="62" ry="78" fill="url(#leaf)" transform="rotate(58 352 198)"/>

  <!-- vein lines -->
  <path d="M260 155 L260 95" stroke="#2d7a38" stroke-width="2" opacity="0.5"/>
  <path d="M200 210 L155 175" stroke="#2d7a38" stroke-width="2" opacity="0.5"/>
  <path d="M320 210 L365 175" stroke="#2d7a38" stroke-width="2" opacity="0.5"/>

  <!-- labels on leaves -->
  <text x="260" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">Father</text>
  <text x="155" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">Son</text>
  <text x="365" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff">Holy Spirit</text>

  <!-- one God on stem -->
  <rect x="210" y="328" width="100" height="32" rx="8" fill="#fff" stroke="#c9a66b"/>
  <text x="260" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#5d4037">ONE GOD</text>

  <text x="260" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b5b4f">Three leaves � one clover � one name</text>
</svg>
