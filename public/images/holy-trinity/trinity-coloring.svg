<svg width="400" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-labelledby="title">
  <title id="title">Holy Trinity clover coloring page</title>
  <rect width="400" height="520" fill="#fff"/>
  <text x="200" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#333">Color the Clover - Name the Trinity</text>

  <path d="M200 400 Q195 300 200 220 Q205 180 200 160" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="130" rx="55" ry="70" fill="none" stroke="#222" stroke-width="3"/>
  <ellipse cx="115" cy="210" rx="55" ry="70" fill="none" stroke="#222" stroke-width="3" transform="rotate(-58 115 210)"/>
  <ellipse cx="285" cy="210" rx="55" ry="70" fill="none" stroke="#222" stroke-width="3" transform="rotate(58 285 210)"/>

  <text x="200" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#444">Father</text>
  <text x="108" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#444">Son</text>
  <text x="292" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">Holy Spirit</text>
  <text x="200" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#444">ONE GOD</text>

  <rect x="48" y="460" width="304" height="44" rx="6" fill="none" stroke="#ccc" stroke-dasharray="4 3"/>
  <text x="200" y="488" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#888">One God, three Persons - Father, Son, Holy Spirit</text>
</svg>
