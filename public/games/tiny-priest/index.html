<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tiny Priest - Welcome to Our Church</title>
        <link rel="stylesheet" href="style.css?v=20260831s" />
        <link rel="icon" type="image/png" href="assets/church.png" />
    </head>
    <body>
        <div id="entry-screen" class="main-container">
            <div class="entry-top-bar">
                <h1 class="main-title">Welcome to Tiny Church.</h1>
            </div>

            <div id="church-scene" class="church-scene">
                <div id="courtyard-stars" class="courtyard-stars" aria-label="Courtyard fun"></div>
                <div class="courtyard-door-glow" aria-hidden="true"></div>
                <div class="church-building" aria-hidden="true">
                    <img
                        src="assets/mass/courtyard/courtyard_entry_scene.png"
                        alt="Church courtyard with hidden pictures to find"
                    />
                </div>

                <div id="courtyard-hits" class="courtyard-hits" aria-label="Hidden pictures to find"></div>

                <div class="entry-assembly">
                    <button
                        type="button"
                        id="character-priest"
                        class="asset character character-button character-priest"
                        data-character="priest"
                        aria-label="Say hello to the priest"
                    >
                        <img src="assets/priest_front.png" alt="Father Priest" />
                    </button>

                    <div
                        id="entry-player-child"
                        class="asset entry-player"
                        data-character="child_girl"
                        aria-hidden="false"
                    >
                        <img
                            src="assets/mass/characters/child_girl_front.png"
                            alt="You"
                        />
                    </div>

                    <button
                        type="button"
                        id="character-nun"
                        class="asset character character-button character-nun"
                        data-character="nun"
                        aria-label="Say hello to the sister"
                    >
                        <img src="assets/nun_front.png" alt="Sister Nun" />
                    </button>
                </div>
            </div>

            <div id="courtyard-fx" class="courtyard-fx" aria-hidden="true">
                <span class="courtyard-cross">✝</span>
            </div>

            <div class="entry-footer">
                <div class="player-picker" id="player-picker" role="group" aria-labelledby="player-picker-label">
                    <span class="player-picker-label" id="player-picker-label">You are:</span>
                    <button
                        type="button"
                        class="player-picker-btn is-selected"
                        data-player="child_girl"
                        aria-pressed="true"
                    >
                        Girl
                    </button>
                    <button
                        type="button"
                        class="player-picker-btn"
                        data-player="child_boy"
                        aria-pressed="false"
                    >
                        Boy
                    </button>
                </div>
                <div id="dialogue-box" class="dialogue-box">
                    Look closely at the courtyard picture! Five things are hiding in the scene. Can you find them all? Then say hello to Father or Sister.
                </div>
                <div id="courtyard-flower-picker" class="courtyard-flower-picker" hidden>
                    <span class="courtyard-flower-picker-label">Offer Mary a flower:</span>
                    <button type="button" class="courtyard-flower-btn" data-flower-color="red" data-flower-label="red">
                        🌹
                    </button>
                    <button type="button" class="courtyard-flower-btn" data-flower-color="white" data-flower-label="white">
                        🤍
                    </button>
                    <button type="button" class="courtyard-flower-btn" data-flower-color="yellow" data-flower-label="yellow">
                        🌼
                    </button>
                </div>
                <div id="entry-actions" class="entry-actions" hidden>
                <button type="button" id="entry-confirm-btn" class="entry-action-btn entry-action-btn--yes">
                    Yes, let's go in
                </button>
                <button type="button" id="entry-decline-btn" class="entry-action-btn entry-action-btn--no">
                    Not now
                </button>
                </div>
            </div>
        </div>

        <div id="entry-flash" class="entry-flash" aria-hidden="true"></div>
        <button type="button" id="fullscreen-btn" class="game-fullscreen-btn" aria-label="Enter fullscreen">
            Fullscreen
        </button>
        <button type="button" id="church-exit-btn" class="church-exit-btn" aria-hidden="true" aria-label="Leave the church and go outside">
            Go outside
        </button>
        <div id="three-container" class="three-container" aria-hidden="true"></div>
        <aside id="mass-navigator" class="mass-navigator" aria-hidden="true">
            <div class="mass-nav-header">
                <div class="mass-nav-title">Mass Order</div>
                <div class="mass-nav-header-actions">
                    <button type="button" id="mass-quest-toggle" class="mass-nav-quest-btn" aria-pressed="false">
                        Join Responses
                    </button>
                    <button
                        type="button"
                        id="mass-quest-practice"
                        class="mass-nav-quest-btn is-active"
                        aria-pressed="true"
                    >
                        Practice
                    </button>
                    <button type="button" id="mass-toggle-btn" class="mass-nav-mass-btn">Start Mass</button>
                </div>
            </div>
            <div id="mass-nav-groups" class="mass-nav-groups"></div>
            <p id="mass-nav-status" class="mass-nav-status" aria-live="polite"></p>
            <p class="mass-nav-hint">WASD move · Space jump · M auto Mass</p>
        </aside>

        <section id="liturgy-hud" class="liturgy-hud" aria-hidden="true">
            <section id="mass-quest-panel" class="mass-quest-panel" aria-hidden="true">
                <div class="mass-quest-meta">
                    <span id="mass-quest-section" class="mass-quest-section"></span>
                    <span id="mass-quest-progress" class="mass-quest-progress" aria-live="polite"></span>
                </div>
                <div id="mass-quest-role" class="mass-quest-role">Children</div>
                <p id="mass-quest-text" class="mass-quest-text"></p>
                <button type="button" id="mass-quest-action" class="mass-quest-action mass-quest-action--speak">
                    Say response
                </button>
            </section>
            <div id="liturgy-subtitle" class="liturgy-subtitle">
                Mass guidance will appear here.
            </div>
        </section>

        <div id="hotspot-modal" class="hotspot-modal" hidden aria-hidden="true">
            <div class="hotspot-modal-card" role="dialog" aria-modal="true" aria-labelledby="hotspot-modal-title">
                <button type="button" id="hotspot-modal-close" class="hotspot-modal-close" aria-label="Close">×</button>
                <h2 id="hotspot-modal-title" class="hotspot-modal-title"></h2>
                <p id="hotspot-modal-body" class="hotspot-modal-body"></p>
            </div>
        </div>

        <script src="vendor/three.min.js"></script>
        <script src="site-copy.js?v=20260614"></script>
        <script src="stations.js?v=20260830"></script>
        <script src="mass-participation-lines.js?v=20260831t"></script>
        <script src="mass-quest.js?v=20260831s"></script>
        <script src="courtyard-events.js?v=20260831s"></script>
        <script src="celebrant-sprites.js?v=20260901o"></script>
        <script src="script.js?v=20260901o"></script>
    </body>
</html>
