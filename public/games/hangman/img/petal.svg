<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 56" aria-hidden="true">
  <defs>
    <linearGradient id="petalFill" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff8fb" />
      <stop offset="35%" stop-color="#f8bbd0" />
      <stop offset="100%" stop-color="#f06292" />
    </linearGradient>
    <linearGradient id="petalShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Soft flower petal: rounded tip, no sharp leaf point -->
  <path
    d="M 10 28
       C 10 14, 22 5, 42 4
       C 72 3, 98 12, 112 28
       C 98 44, 72 53, 42 52
       C 22 51, 10 42, 10 28 Z"
    fill="url(#petalFill)"
    stroke="#e91e8c"
    stroke-width="1.4"
    stroke-linejoin="round"
  />
  <path
    d="M 38 10
       C 58 8, 78 14, 88 26
       C 72 18, 52 14, 38 16 Z"
    fill="url(#petalShine)"
  />
</svg>
