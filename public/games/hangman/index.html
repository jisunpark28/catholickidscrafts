<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman game | Catholic Kids Crafts</title>
    <link rel="stylesheet" href="hangman.css?v=11">
</head>
<body>
    <main class="container">
        <div class="game-body">
        <header>
            <p>Guess the word before the flower loses all its petals.</p>
        </header>

        <div class="hangman-visual-stage">
            <div class="hangman-visual-glow" aria-hidden="true"></div>
            <div class="hangman-visual-wrap">
                <section id="hangman-visual">
                    <svg class="flower-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400" aria-hidden="true" focusable="false">
                      <defs>
                        <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                          <stop offset="0%" stop-color="#ffe566"/>
                          <stop offset="40%" stop-color="#ffc933"/>
                          <stop offset="78%" stop-color="#f0a020"/>
                          <stop offset="100%" stop-color="#e08a14"/>
                        </linearGradient>
                        <radialGradient id="centerGrad" cx="46%" cy="40%" r="62%">
                          <stop offset="0%" stop-color="#a06732"/>
                          <stop offset="55%" stop-color="#6b3f1a"/>
                          <stop offset="100%" stop-color="#3f240e"/>
                        </radialGradient>
                        <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                          <stop offset="0%" stop-color="#6bb04f"/>
                          <stop offset="55%" stop-color="#3f8f3a"/>
                          <stop offset="100%" stop-color="#2e7d32"/>
                        </linearGradient>
                        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#9ccc65"/>
                          <stop offset="100%" stop-color="#2e7d32"/>
                        </linearGradient>
                        <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
                          <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#7a6240" flood-opacity="0.22"/>
                        </filter>
                      </defs>
                    
                      <ellipse cx="180" cy="372" rx="82" ry="13" fill="#c8d9a8" opacity="0.38"/>
                    
                      <g id="stem-and-leaves" filter="url(#softShadow)">
                        <path d="M180 188 C176 248 173 305 180 358" fill="none" stroke="url(#stemGrad)" stroke-width="11" stroke-linecap="round"/>
                        <path d="M180 188 C176 248 173 305 180 358" fill="none" stroke="#1f5c24" stroke-width="2.2" stroke-linecap="round" opacity="0.32"/>
                        <path d="M176 274 C138 252 108 264 104 290 C128 310 158 300 176 284 Z" fill="url(#leafGrad)" stroke="#246328" stroke-width="1.2"/>
                        <path d="M176 278 C148 266 126 274 118 288" fill="none" stroke="#1f5c24" stroke-width="1.15" opacity="0.45"/>
                        <path d="M184 304 C226 286 256 300 252 326 C226 342 198 332 184 316 Z" fill="url(#leafGrad)" stroke="#246328" stroke-width="1.2"/>
                        <path d="M184 308 C212 298 234 308 242 322" fill="none" stroke="#1f5c24" stroke-width="1.15" opacity="0.45"/>
                      </g>
                    
                      <g id="petals-container" filter="url(#softShadow)">
                        <g class="petal petal-1" data-petal-index="0" transform="rotate(0 180 155)">
                          <g class="petal-motion">
                            <path class="petal-shape" d="M180 168 C152 150 146 95 180 52 C214 95 208 150 180 168 Z" fill="url(#petalGrad)" stroke="#d4891a" stroke-width="1.45"/>
                            <path d="M180 163 C162 145 160 100 180 67" fill="none" stroke="#fff6c2" stroke-width="3.1" stroke-linecap="round" opacity="0.48"/>
                            <path d="M180 157 C170 137 168 107 180 81" fill="none" stroke="#e89a20" stroke-width="1.25" opacity="0.38"/>
                          </g>
                        </g>
                        <g class="petal petal-2" data-petal-index="1" transform="rotate(60 180 155)">
                          <g class="petal-motion">
                            <path class="petal-shape" d="M180 168 C152 150 146 95 180 52 C214 95 208 150 180 168 Z" fill="url(#petalGrad)" stroke="#d4891a" stroke-width="1.45"/>
                            <path d="M180 163 C162 145 160 100 180 67" fill="none" stroke="#fff6c2" stroke-width="3.1" stroke-linecap="round" opacity="0.48"/>
                            <path d="M180 157 C170 137 168 107 180 81" fill="none" stroke="#e89a20" stroke-width="1.25" opacity="0.38"/>
                          </g>
                        </g>
                        <g class="petal petal-3" data-petal-index="2" transform="rotate(120 180 155)">
                          <g class="petal-motion">
                            <path class="petal-shape" d="M180 168 C152 150 146 95 180 52 C214 95 208 150 180 168 Z" fill="url(#petalGrad)" stroke="#d4891a" stroke-width="1.45"/>
                            <path d="M180 163 C162 145 160 100 180 67" fill="none" stroke="#fff6c2" stroke-width="3.1" stroke-linecap="round" opacity="0.48"/>
                            <path d="M180 157 C170 137 168 107 180 81" fill="none" stroke="#e89a20" stroke-width="1.25" opacity="0.38"/>
                          </g>
                        </g>
                        <g class="petal petal-4" data-petal-index="3" transform="rotate(180 180 155)">
                          <g class="petal-motion">
                            <path class="petal-shape" d="M180 168 C152 150 146 95 180 52 C214 95 208 150 180 168 Z" fill="url(#petalGrad)" stroke="#d4891a" stroke-width="1.45"/>
                            <path d="M180 163 C162 145 160 100 180 67" fill="none" stroke="#fff6c2" stroke-width="3.1" stroke-linecap="round" opacity="0.48"/>
                            <path d="M180 157 C170 137 168 107 180 81" fill="none" stroke="#e89a20" stroke-width="1.25" opacity="0.38"/>
                          </g>
                        </g>
                        <g class="petal petal-5" data-petal-index="4" transform="rotate(240 180 155)">
                          <g class="petal-motion">
                            <path class="petal-shape" d="M180 168 C152 150 146 95 180 52 C214 95 208 150 180 168 Z" fill="url(#petalGrad)" stroke="#d4891a" stroke-width="1.45"/>
                            <path d="M180 163 C162 145 160 100 180 67" fill="none" stroke="#fff6c2" stroke-width="3.1" stroke-linecap="round" opacity="0.48"/>
                            <path d="M180 157 C170 137 168 107 180 81" fill="none" stroke="#e89a20" stroke-width="1.25" opacity="0.38"/>
                          </g>
                        </g>
                        <g class="petal petal-6" data-petal-index="5" transform="rotate(300 180 155)">
                          <g class="petal-motion">
                            <path class="petal-shape" d="M180 168 C152 150 146 95 180 52 C214 95 208 150 180 168 Z" fill="url(#petalGrad)" stroke="#d4891a" stroke-width="1.45"/>
                            <path d="M180 163 C162 145 160 100 180 67" fill="none" stroke="#fff6c2" stroke-width="3.1" stroke-linecap="round" opacity="0.48"/>
                            <path d="M180 157 C170 137 168 107 180 81" fill="none" stroke="#e89a20" stroke-width="1.25" opacity="0.38"/>
                          </g>
                        </g>
                      </g>
                    
                      <g id="flower-center" filter="url(#softShadow)">
                        <circle cx="180" cy="155" r="36" fill="url(#centerGrad)" stroke="#3d2410" stroke-width="1.6"/>
                        <circle cx="180" cy="155" r="27.5" fill="none" stroke="#c49a5a" stroke-width="2" opacity="0.35"/>
                        <circle cx="180" cy="155" r="12" fill="#5a3314" opacity="0.55"/>
                        <circle cx="187.0" cy="155.0" r="1.9" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="183.5" cy="160.6" r="1.9" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="176.5" cy="160.6" r="1.9" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="173.0" cy="155.0" r="1.9" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="176.5" cy="149.4" r="1.9" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="183.5" cy="149.4" r="1.9" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="193.2" cy="159.4" r="1.9" fill="#d4a574" opacity="0.85"/>
                        <circle cx="187.0" cy="166.2" r="1.9" fill="#d4a574" opacity="0.85"/>
                        <circle cx="177.6" cy="167.7" r="1.9" fill="#d4a574" opacity="0.85"/>
                        <circle cx="169.3" cy="163.3" r="1.9" fill="#d4a574" opacity="0.85"/>
                        <circle cx="166.0" cy="155.0" r="1.9" fill="#d4a574" opacity="0.85"/>
                        <circle cx="169.3" cy="146.7" r="1.9" fill="#d4a574" opacity="0.85"/>
                        <circle cx="177.6" cy="142.3" r="1.9" fill="#d4a574" opacity="0.85"/>
                        <circle cx="187.0" cy="143.9" r="1.9" fill="#d4a574" opacity="0.85"/>
                        <circle cx="193.2" cy="150.6" r="1.9" fill="#d4a574" opacity="0.85"/>
                        <circle cx="196.1" cy="167.4" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="187.1" cy="173.2" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="176.3" cy="174.0" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="166.5" cy="169.8" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="160.3" cy="161.6" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="159.3" cy="151.6" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="163.9" cy="142.6" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="172.9" cy="136.8" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="183.7" cy="136.0" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="193.5" cy="140.2" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="199.7" cy="148.4" r="1.7" fill="#c49a5a" opacity="0.85"/>
                        <circle cx="200.7" cy="158.4" r="1.7" fill="#c49a5a" opacity="0.85"/>
                      </g>
                    </svg>
                </section>
            </div>
        </div>

        <p id="hint-display" role="status"></p>
        <div id="word-display" aria-live="polite">_ _ _ _ _</div>

        <section class="info" aria-live="polite">
            <p>Attempts Left: <span id="attempts">6</span></p>
            <p>Guessed: <span id="guessed-letters">-</span></p>
        </section>

        <section id="input-section">
            <label class="sr-only" for="letter-input">Guess a letter</label>
            <input type="text" id="letter-input" maxlength="1" placeholder="A" autofocus autocomplete="off" inputmode="text" aria-label="Guess a letter">
            <button type="button" id="guess-btn">Guess</button>
        </section>
        </div>

        <div class="reset-wrap">
            <button type="button" id="reset-btn">New Game</button>
        </div>
    </main>

    <script src="catholic-words.js"></script>
    <script src="site-copy.js"></script>
    <script src="boot.js"></script>
</body>
</html>
